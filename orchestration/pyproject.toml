[project]
name = "alexi-langgraph-sidecar"
version = "0.1.0"
description = "Local-only, review-gated LangGraph patch planning for Alexi"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "langchain-ollama>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "uvicorn>=0.30,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["alexi_graph*"]
